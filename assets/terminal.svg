<svg fill="none" viewBox="0 0 850 320" width="100%" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term-header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
  </defs>

  <style>
    .term-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; }
    .prompt { fill: #00f5d4; font-weight: bold; }
    .cmd { fill: #f2e9e1; font-weight: 600; }
    .key { fill: #c77dff; font-weight: 600; }
    .val { fill: #a5d6ff; }
    .cursor { fill: #00f5d4; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Main Terminal Box -->
  <rect width="850" height="320" rx="12" fill="#0d1117" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Header Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 838 0 C 844.63 0 850 5.37 850 12 L 850 36 L 0 36 Z" fill="url(#term-header-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text x="80" y="22" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500">shahroznasir@architect: ~/environment</text>

  <!-- Command Line 1 -->
  <text x="24" y="68" class="term-text prompt">shahroz@arch:~$</text>
  <text x="160" y="68" class="term-text cmd">neofetch --user shahroznasir</text>

  <!-- Ascii Art / Avatar -->
  <g transform="translate(24, 95)" class="term-text">
    <text x="0" y="20" fill="#00f5d4"> /\_/\ </text>
    <text x="0" y="40" fill="#00f5d4">( o.o )</text>
    <text x="0" y="60" fill="#00f5d4"> &gt; ^ &lt; </text>
  </g>

  <!-- Output Properties -->
  <g transform="translate(130, 95)" class="term-text">
    <text x="0" y="20" class="key">OS:</text>
    <text x="90" y="20" class="val">Cyberpunk Arch Linux x86_64</text>

    <text x="0" y="42" class="key">Kernel:</text>
    <text x="90" y="42" class="val">AsyncIO 3.12.0-fastapi</text>

    <text x="0" y="64" class="key">Uptime:</text>
    <text x="90" y="64" class="val">99.99% Continuous Learning</text>

    <text x="0" y="86" class="key">Focus:</text>
    <text x="90" y="86" class="val">AI Systems &amp; High-Throughput Microservices</text>

    <text x="0" y="108" class="key">Location:</text>
    <text x="90" y="108" class="val">Bengaluru, KA, India 🇮🇳</text>

    <text x="0" y="130" class="key">Stack:</text>
    <text x="90" y="130" class="val">Python, FastAPI, AsyncIO, AI/LLMs, REST APIs</text>
  </g>

  <!-- Command Line 2 -->
  <text x="24" y="275" class="term-text prompt">shahroz@arch:~$</text>
  <text x="160" y="275" class="term-text cmd">python -c "import shahroznasir; shahroznasir.deploy()"</text>
  <rect x="620" y="262" width="8" height="16" class="cursor" />
</svg>
