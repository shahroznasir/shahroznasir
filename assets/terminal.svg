<svg fill="none" viewBox="0 0 850 320" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .term-container {
          width: 850px;
          height: 320px;
          background: #0d1117;
          border-radius: 12px;
          border: 1px solid rgba(0, 245, 212, 0.2);
          box-shadow: 0 15px 35px rgba(0,0,0,0.6);
          font-family: 'Fira Code', 'Courier New', monospace;
          overflow: hidden;
          box-sizing: border-box;
        }
        .term-header {
          height: 36px;
          background: #161b22;
          display: flex;
          align-items: center;
          padding: 0 16px;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .term-dots {
          display: flex;
          gap: 8px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }
        .term-title {
          margin-left: 20px;
          color: #8b949e;
          font-size: 13px;
          font-weight: 500;
        }
        .term-body {
          padding: 20px 24px;
          color: #c9d1d9;
          font-size: 14px;
          line-height: 1.6;
        }
        .prompt { color: #00f5d4; font-weight: bold; }
        .cmd { color: #f2e9e1; font-weight: 600; }
        .out-key { color: #7b2cbf; font-weight: 600; }
        .out-str { color: #a5d6ff; }
        .out-num { color: #79c0ff; }
        .out-bool { color: #ff7b72; }
        .cursor {
          display: inline-block;
          width: 8px;
          height: 16px;
          background: #00f5d4;
          margin-left: 4px;
          animation: blink 1s infinite;
          vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      </style>
      <div class="term-container">
        <div class="term-header">
          <div class="term-dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div class="term-title">shahroznasir@architect: ~/environment</div>
        </div>
        <div class="term-body">
          <div><span class="prompt">shahroz@arch:~$</span> <span class="cmd">neofetch --user shahroznasir</span></div>
          <div style="margin-top: 10px; display: flex; gap: 20px;">
            <div style="color: #00f5d4; font-size: 13px;">
              &nbsp;/\_/\<br/>
              ( o.o )<br/>
              &nbsp;&gt; ^ &lt;
            </div>
            <div>
              <div><span class="out-key">OS:</span> <span class="out-str">Cyberpunk Arch Linux x86_64</span></div>
              <div><span class="out-key">Kernel:</span> <span class="out-str">AsyncIO 3.12.0-fastapi</span></div>
              <div><span class="out-key">Uptime:</span> <span class="out-str">99.99% Continuous Learning</span></div>
              <div><span class="out-key">Focus:</span> <span class="out-str">AI System Engineering &amp; High-Throughput Microservices</span></div>
              <div><span class="out-key">Location:</span> <span class="out-str">Bengaluru, KA, India 🇮🇳</span></div>
              <div><span class="out-key">Primary Stack:</span> <span class="out-str">Python, FastAPI, AsyncIO, AI, REST APIs</span></div>
            </div>
          </div>
          <div style="margin-top: 14px;"><span class="prompt">shahroz@arch:~$</span> <span class="cmd">python -c "import shahroznasir; shahroznasir.deploy()"</span><span class="cursor"></span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
