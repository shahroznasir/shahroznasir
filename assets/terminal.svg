<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320">
  <defs>
    <linearGradient id="term-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Box -->
  <rect width="850" height="320" rx="12" fill="#0d1117" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 838 0 C 844.63 0 850 5.37 850 12 L 850 36 L 0 36 Z" fill="url(#term-hdr)"/>

  <!-- Control Dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>

  <!-- Header Title -->
  <text x="80" y="22" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">shahroznasir@architect: ~/environment</text>

  <!-- Prompt 1 -->
  <text x="24" y="68" fill="#00f5d4" font-family="monospace" font-size="14" font-weight="bold">shahroz@arch:~$</text>
  <text x="160" y="68" fill="#f2e9e1" font-family="monospace" font-size="14" font-weight="bold">neofetch --user shahroznasir</text>

  <!-- Cat ASCII -->
  <text x="24" y="115" fill="#00f5d4" font-family="monospace" font-size="13"> /\_/\ </text>
  <text x="24" y="135" fill="#00f5d4" font-family="monospace" font-size="13">( o.o )</text>
  <text x="24" y="155" fill="#00f5d4" font-family="monospace" font-size="13"> &gt; ^ &lt; </text>

  <!-- System Info Grid -->
  <g transform="translate(130, 95)">
    <text x="0" y="20" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">OS:</text>
    <text x="90" y="20" fill="#a5d6ff" font-family="monospace" font-size="13">Cyberpunk Arch Linux x86_64</text>

    <text x="0" y="42" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">Kernel:</text>
    <text x="90" y="42" fill="#a5d6ff" font-family="monospace" font-size="13">AsyncIO 3.12.0-fastapi</text>

    <text x="0" y="64" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">Uptime:</text>
    <text x="90" y="64" fill="#a5d6ff" font-family="monospace" font-size="13">99.99% Continuous Learning</text>

    <text x="0" y="86" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">Focus:</text>
    <text x="90" y="86" fill="#a5d6ff" font-family="monospace" font-size="13">AI Systems &amp; High-Throughput Microservices</text>

    <text x="0" y="108" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">Location:</text>
    <text x="90" y="108" fill="#a5d6ff" font-family="monospace" font-size="13">Bengaluru, KA, India 🇮🇳</text>

    <text x="0" y="130" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">Stack:</text>
    <text x="90" y="130" fill="#a5d6ff" font-family="monospace" font-size="13">Python, FastAPI, AsyncIO, AI/LLMs, REST APIs</text>
  </g>

  <!-- Prompt 2 -->
  <text x="24" y="275" fill="#00f5d4" font-family="monospace" font-size="14" font-weight="bold">shahroz@arch:~$</text>
  <text x="160" y="275" fill="#f2e9e1" font-family="monospace" font-size="14" font-weight="bold">python -c "import shahroznasir; shahroznasir.deploy()"</text>
  <rect x="620" y="262" width="8" height="16" fill="#00f5d4"/>
</svg>
