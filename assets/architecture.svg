<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Box -->
  <rect width="900" height="240" rx="16" fill="#0d1117" stroke="#7b2cbf" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Node 1: Client Request -->
  <g transform="translate(30, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#00f5d4" stroke-dasharray="0" stroke-width="1.5" />
    <text x="85" y="45" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">🌐 Client Request</text>
    <text x="85" y="75" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Async REST / Webhooks</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 210 120 L 240 120" stroke="#7b2cbf" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="225" y="112" fill="#00f5d4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">➔</text>

  <!-- Node 2: FastAPI Gateway -->
  <g transform="translate(250, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#9d4edd" stroke-width="1.5" />
    <text x="85" y="45" fill="#c77dff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ FastAPI Gateway</text>
    <text x="85" y="75" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">AsyncIO &amp; Pydantic V2</text>
  </g>

  <!-- Arrow 2 -->
  <text x="445" y="112" fill="#00f5d4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">➔</text>

  <!-- Node 3: AI Engine -->
  <g transform="translate(470, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#00f5d4" stroke-width="1.5" />
    <text x="85" y="45" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">🧠 AI &amp; LLM Engine</text>
    <text x="85" y="75" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">NLP &amp; Vector Index</text>
  </g>

  <!-- Arrow 3 -->
  <text x="665" y="112" fill="#00f5d4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">➔</text>

  <!-- Node 4: Storage -->
  <g transform="translate(690, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#7b2cbf" stroke-width="1.5" />
    <text x="85" y="45" fill="#9d4edd" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">💾 Data &amp; Cache</text>
    <text x="85" y="75" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">PostgreSQL / Redis</text>
  </g>
</svg>
