<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <!-- Main Frame -->
  <rect width="900" height="240" rx="16" fill="#0d1117" stroke="#7b2cbf" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Node 1 -->
  <g transform="translate(30, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="85" y="45" fill="#00f5d4" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🌐 Client Request</text>
    <text x="85" y="75" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Async REST / Webhooks</text>
  </g>

  <!-- Arrow 1 -->
  <text x="225" y="125" fill="#00f5d4" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">➔</text>

  <!-- Node 2 -->
  <g transform="translate(250, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#9d4edd" stroke-width="1.5"/>
    <text x="85" y="45" fill="#c77dff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡ FastAPI Gateway</text>
    <text x="85" y="75" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">AsyncIO &amp; Pydantic V2</text>
  </g>

  <!-- Arrow 2 -->
  <text x="445" y="125" fill="#00f5d4" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">➔</text>

  <!-- Node 3 -->
  <g transform="translate(470, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="85" y="45" fill="#00f5d4" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🧠 AI &amp; LLM Engine</text>
    <text x="85" y="75" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">NLP &amp; Vector Index</text>
  </g>

  <!-- Arrow 3 -->
  <text x="665" y="125" fill="#00f5d4" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">➔</text>

  <!-- Node 4 -->
  <g transform="translate(690, 60)">
    <rect width="170" height="120" rx="12" fill="#161b22" stroke="#7b2cbf" stroke-width="1.5"/>
    <text x="85" y="45" fill="#9d4edd" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">💾 Data &amp; Cache</text>
    <text x="85" y="75" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">PostgreSQL / Redis</text>
  </g>
