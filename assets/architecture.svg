<svg fill="none" viewBox="0 0 900 240" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .arch-card {
          width: 900px;
          height: 240px;
          background: rgba(13, 17, 23, 0.9);
          border-radius: 16px;
          border: 1px solid rgba(123, 44, 191, 0.3);
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          display: flex;
          align-items: center;
          justify-content: space-around;
          padding: 20px;
          box-sizing: border-box;
          font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .node {
          background: rgba(22, 27, 34, 0.9);
          border: 1px solid rgba(0, 245, 212, 0.4);
          border-radius: 12px;
          padding: 16px 20px;
          color: #fff;
          text-align: center;
          box-shadow: 0 4px 15px rgba(0, 245, 212, 0.1);
          width: 180px;
        }
        .node-title {
          font-weight: 700;
          font-size: 15px;
          color: #00f5d4;
          margin-bottom: 6px;
        }
        .node-desc {
          font-size: 12px;
          color: #8b949e;
        }
        .arrow {
          font-size: 24px;
          color: #7b2cbf;
          font-weight: bold;
          animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      </style>
      <div class="arch-card">
        <div class="node">
          <div class="node-title">🌐 Client / API Request</div>
          <div class="node-desc">Async REST / Webhooks</div>
        </div>
        <div class="arrow">➔</div>
        <div class="node" style="border-color: rgba(123, 44, 191, 0.5);">
          <div class="node-title" style="color: #9d4edd;">⚡ FastAPI Gateway</div>
          <div class="node-desc">AsyncIO &amp; Pydantic V2</div>
        </div>
        <div class="arrow">➔</div>
        <div class="node" style="border-color: rgba(0, 245, 212, 0.5);">
          <div class="node-title">🧠 AI Engine &amp; LLM</div>
          <div class="node-desc">NLP / Vector Index / Prompts</div>
        </div>
        <div class="arrow">➔</div>
        <div class="node">
          <div class="node-title">💾 Storage &amp; Cache</div>
          <div class="node-desc">PostgreSQL / Redis</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
