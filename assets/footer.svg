<svg fill="none" viewBox="0 0 1000 120" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .footer-card {
          width: 1000px;
          height: 120px;
          background: #090d16;
          border-radius: 16px;
          border: 1px solid rgba(0, 245, 212, 0.2);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 40px;
          box-sizing: border-box;
          font-family: 'Segoe UI', system-ui, sans-serif;
          position: relative;
          overflow: hidden;
        }
        .footer-glow {
          position: absolute;
          width: 100%;
          height: 100%;
          top: 0; left: 0;
          background: radial-gradient(circle at 50% 120%, rgba(0, 245, 212, 0.25), transparent 70%);
        }
        .footer-text {
          color: #94a3b8;
          font-size: 14px;
          z-index: 2;
        }
        .footer-highlight {
          color: #00f5d4;
          font-weight: 700;
        }
      </style>
      <div class="footer-card">
        <div class="footer-glow"></div>
        <div class="footer-text">
          Designed with ❤️ for <span class="footer-highlight">Shahroz Nasir</span> &bull; 
          Powered by <span class="footer-highlight">FastAPI &amp; AI Technologies</span>
        </div>
        <div class="footer-text">
          <span class="footer-highlight">Bengaluru, India 🇮🇳</span> &bull; Continuous Innovation
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
