<svg fill="none" viewBox="0 0 1000 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <radialGradient id="footer-glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="120" rx="16" fill="url(#footer-bg)" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Glow Layer -->
  <rect width="1000" height="120" rx="16" fill="url(#footer-glow)" />

  <!-- Left Text -->
  <text x="50" y="65" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500">
    Designed with ❤️ for <tspan fill="#00f5d4" font-weight="700">Shahroz Nasir</tspan> &bull; Powered by <tspan fill="#c77dff" font-weight="700">FastAPI &amp; AI Technologies</tspan>
  </text>

  <!-- Right Text -->
  <text x="950" y="65" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="end">
    <tspan fill="#00f5d4" font-weight="700">Bengaluru, India 🇮🇳</tspan> &bull; Continuous Innovation
  </text>
</svg>
