<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" rx="20" fill="url(#bg)" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Card Body -->
  <rect x="40" y="35" width="920" height="270" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Status Pill -->
  <rect x="75" y="70" width="220" height="32" rx="16" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="95" cy="86" r="4" fill="#00f5d4"/>
  <text x="110" y="91" fill="#00f5d4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">SYSTEM ONLINE &amp; ACTIVE</text>

  <!-- Name Title -->
  <text x="75" y="155" fill="url(#text)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Shahroz Nasir</text>

  <!-- Subtitle -->
  <text x="75" y="192" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18">AI Systems Architect &amp; High-Performance Async Backend Engineer</text>

  <!-- Skill Badges -->
  <g transform="translate(75, 225)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#161b22" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="15" y="22" fill="#00f5d4" font-family="monospace" font-size="13" font-weight="bold">⚡ FastAPI / AsyncIO</text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="205" height="34" rx="8" fill="#161b22" stroke="#9d4edd" stroke-opacity="0.4" stroke-width="1"/>
    <text x="195" y="22" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">🤖 AI &amp; LLM Orchestration</text>

    <!-- Badge 3 -->
    <rect x="400" y="0" width="135" height="34" rx="8" fill="#161b22" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="415" y="22" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold">🐍 Python Core</text>

    <!-- Badge 4 -->
    <rect x="550" y="0" width="170" height="34" rx="8" fill="#161b22" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="565" y="22" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">📍 Bengaluru, India</text>
  </g>
</svg>
