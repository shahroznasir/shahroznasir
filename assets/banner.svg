<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <!-- Dark Cyberpunk Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f5d4"/>
      <stop offset="80%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <!-- Inner Card Glass Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Background Container -->
  <rect width="1000" height="340" rx="20" fill="url(#bg)" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Radial Glow Layer -->
  <rect width="1000" height="340" rx="20" fill="url(#glow-center)"/>

  <!-- Inner Glass Card (Symmetrically Centered) -->
  <rect x="35" y="30" width="930" height="280" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Status Pill (Centered at x=500) -->
  <g transform="translate(390, 60)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00f5d4"/>
    <text x="35" y="21" fill="#00f5d4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">SYSTEM ONLINE &amp; ACTIVE</text>
  </g>

  <!-- Main Name Title (Centered at x=500) -->
  <text x="500" y="145" fill="url(#title-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" text-anchor="middle">Shahroz Nasir</text>

  <!-- Subtitle (Centered at x=500) -->
  <text x="500" y="184" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" text-anchor="middle">AI Systems Architect &amp; High-Performance Async Backend Engineer</text>

  <!-- Skill Badges Row (Centered Symmetry across x=500) -->
  <g transform="translate(140, 222)">
    <!-- Badge 1: FastAPI -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#161b22" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="15" y="22" fill="#00f5d4" font-family="monospace" font-size="13" font-weight="bold">⚡ FastAPI / AsyncIO</text>

    <!-- Badge 2: AI & LLMs -->
    <rect x="180" y="0" width="205" height="34" rx="8" fill="#161b22" stroke="#9d4edd" stroke-opacity="0.4" stroke-width="1"/>
    <text x="195" y="22" fill="#c77dff" font-family="monospace" font-size="13" font-weight="bold">🤖 AI &amp; LLM Orchestration</text>

    <!-- Badge 3: Python Core -->
    <rect x="400" y="0" width="135" height="34" rx="8" fill="#161b22" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="415" y="22" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold">🐍 Python Core</text>

    <!-- Badge 4: Location -->
    <rect x="550" y="0" width="170" height="34" rx="8" fill="#161b22" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="565" y="22" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">📍 Bengaluru, India</text>
  </g>
</svg>
