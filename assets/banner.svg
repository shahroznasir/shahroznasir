<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Dominant Name Text Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f5d4"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Cyber Grid Pattern (5% opacity) -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .status-dot-anim { animation: pulse 2.5s ease-in-out infinite; transform-origin: 405px 68px; }
  </style>

  <!-- Outer Dark Container with Outer Cyan Glow -->
  <rect width="1000" height="360" rx="20" fill="url(#bg)" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="2" />

  <!-- Background Grid Texture (5% Opacity) -->
  <rect width="1000" height="360" rx="20" fill="url(#cyber-grid)" />

  <!-- Neural Network Focal Art on Right Side (10% Opacity) -->
  <g opacity="0.1" stroke="#00f5d4" stroke-width="1.5" fill="none">
    <polygon points="780,70 850,30 920,70 920,150 850,190 780,150" />
    <polygon points="800,85 850,55 900,85 900,135 850,165 800,135" />
    <circle cx="850" cy="110" r="20" fill="#00f5d4" fill-opacity="0.2" />
    <line x1="850" y1="30" x2="850" y2="55" />
    <line x1="850" y1="165" x2="850" y2="190" />
    <line x1="780" y1="70" x2="800" y2="85" />
    <line x1="920" y1="70" x2="900" y2="85" />
    <line x1="780" y1="150" x2="800" y2="135" />
    <line x1="920" y1="150" x2="900" y2="135" />
    <circle cx="780" cy="70" r="4" fill="#00f5d4" />
    <circle cx="920" cy="70" r="4" fill="#00f5d4" />
    <circle cx="850" cy="30" r="4" fill="#00f5d4" />
    <circle cx="850" cy="190" r="4" fill="#00f5d4" />
    <circle cx="780" cy="150" r="4" fill="#00f5d4" />
    <circle cx="920" cy="150" r="4" fill="#00f5d4" />
  </g>

  <!-- Main Glassmorphism Card Frame -->
  <rect x="35" y="30" width="930" height="300" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Top Status Badge (Centered) -->
  <g transform="translate(385, 52)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4" fill="#00f5d4" class="status-dot-anim" />
    <text x="35" y="21" fill="#00f5d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">SYSTEM ONLINE &amp; ACTIVE</text>
  </g>

  <!-- Dominant Name Title -->
  <text x="500" y="142" fill="url(#name-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5" text-anchor="middle">Shahroz Nasir</text>

  <!-- Grounded & Professional Subtitle -->
  <text x="500" y="184" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" letter-spacing="0.2" text-anchor="middle">AI &amp; Backend Software Engineer • FastAPI • LLMs • Distributed Systems</text>

  <!-- Signature Engineering Line -->
  <text x="500" y="214" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="400" text-anchor="middle">"Engineering AI systems with microsecond performance, reliability, and clean architecture."</text>

  <!-- Story-telling Tech Pills with Clean SVG Vector Icons (Centered) -->
  <g transform="translate(75, 252)">
    <!-- Pill 1: Backend Systems (FastAPI) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="36" rx="8" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1.2" />
      <path d="M 22 10 L 14 20 L 19 20 L 16 27 L 24 17 L 19 17 Z" fill="#00f5d4" />
      <text x="34" y="23" fill="#00f5d4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Backend (FastAPI)</text>
    </g>

    <!-- Pill 2: AI & LLM Systems -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
      <rect x="220" y="11" width="12" height="12" rx="2" fill="none" stroke="#c77dff" stroke-width="1.5" />
      <circle cx="226" cy="17" r="2" fill="#c77dff" />
      <line x1="226" y1="8" x2="226" y2="11" stroke="#c77dff" stroke-width="1.5" />
      <line x1="226" y1="23" x2="226" y2="26" stroke="#c77dff" stroke-width="1.5" />
      <line x1="217" y1="17" x2="220" y2="17" stroke="#c77dff" stroke-width="1.5" />
      <line x1="232" y1="17" x2="235" y2="17" stroke="#c77dff" stroke-width="1.5" />
      <text x="242" y="23" fill="#c77dff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AI &amp; LLM Systems</text>
    </g>

    <!-- Pill 3: Python Ecosystem -->
    <g transform="translate(425, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <path d="M 440 13 L 435 18 L 440 23 M 448 13 L 453 18 L 448 23" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="460" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Python Ecosystem</text>
    </g>

    <!-- Pill 4: Bengaluru, India -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="175" height="36" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.2" />
      <path d="M 636 12 C 633 12 631 14 631 17 C 631 21 636 25 636 25 C 636 25 641 21 641 17 C 641 14 639 12 636 12 Z M 636 18.5 C 635 18.5 634.3 17.8 634.3 17 C 634.3 16.2 635 15.5 636 15.5 C 637 15.5 637.7 16.2 637.7 17 C 637.7 17.8 637 18.5 636 18.5 Z" fill="#94a3b8" />
      <text x="648" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Bengaluru, India</text>
    </g>
  </g>
</svg>
