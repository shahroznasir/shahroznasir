<svg fill="none" viewBox="0 0 1000 340" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orb-purple" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7b2cbf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-cyan" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .pulsing-orb { animation: pulse 4s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="340" rx="20" fill="url(#bg-grad)" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Grid Layer -->
  <rect width="1000" height="340" rx="20" fill="url(#grid)" />

  <!-- Glow Orbs -->
  <circle cx="150" cy="80" r="250" fill="url(#orb-purple)" class="pulsing-orb" />
  <circle cx="850" cy="260" r="280" fill="url(#orb-cyan)" class="pulsing-orb" />

  <!-- Glass Card Frame -->
  <rect x="40" y="35" width="920" height="270" rx="16" fill="url(#glass-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Status Badge -->
  <rect x="75" y="70" width="220" height="32" rx="16" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="95" cy="86" r="4" fill="#00f5d4" />
  <text x="110" y="91" fill="#00f5d4" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SYSTEM ONLINE &amp; ACTIVE</text>

  <!-- Title Text -->
  <text x="75" y="155" fill="url(#text-grad)" font-family="'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Shahroz Nasir</text>

  <!-- Subtitle Text -->
  <text x="75" y="192" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400">AI Systems Architect &amp; High-Performance Async Backend Engineer</text>

  <!-- Tags Container -->
  <!-- Tag 1: FastAPI -->
  <rect x="75" y="225" width="160" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(0,245,212,0.3)" stroke-width="1" />
  <text x="92" y="247" fill="#00f5d4" font-family="monospace" font-size="13" font-weight="600">⚡ FastAPI / AsyncIO</text>

  <!-- Tag 2: AI & LLMs -->
  <rect x="247" y="225" width="200" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(157,78,221,0.4)" stroke-width="1" />
  <text x="264" y="247" fill="#c77dff" font-family="monospace" font-size="13" font-weight="600">🤖 AI &amp; LLM Orchestration</text>

  <!-- Tag 3: Python Core -->
  <rect x="459" y="225" width="130" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="476" y="247" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">🐍 Python Core</text>

  <!-- Tag 4: Location -->
  <rect x="601" y="225" width="165" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="618" y="247" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="600">📍 Bengaluru, India</text>
</svg>
